              <button class="btn ghost danger wide-btn" id="p-delete" data-t="deleteProfile"></button>
            </div>
            <p id="p-offline" class="muted center" data-t="needNet" hidden></p>
            <p class="center"><a href="privacy.html" data-t="privacy"></a></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="scr-ball" class="overlay" hidden>
    <div class="card result">
      <div id="ball-icon" class="ball-hero"></div>
      <h2 id="ball-name"></h2>
      <p id="ball-hp" class="muted"></p>
      <p id="ball-about"></p>
      <p id="ball-super" class="sup-line"></p>
      <div id="ball-path" class="bpath"></div>
      <div id="ball-buy"></div>
      <h3 id="ball-skins-title" data-t="skinsTitle"></h3>
      <div id="ball-skins" class="skin-row"></div>
      <button class="btn ghost wide-btn" id="ball-close" data-t="close"></button>
    </div>
  </section>

  <section id="scr-reward" class="overlay" hidden>
    <div class="card result reward">
      <div id="rw-icon" class="ball-hero pop"></div>
      <h2 id="rw-text"></h2>
      <p id="rw-sub" class="muted"></p>
      <button class="btn primary big wide-btn" id="rw-open" data-t="chestOpen" hidden></button>
      <button class="btn primary big wide-btn" id="rw-ok" data-t="cool"></button>
    </div>
  </section>

  <section id="scr-chest" class="overlay" hidden>
    <div class="card result chests">
      <h2 data-t="chestsTitle"></h2>
      <p class="muted" data-t="stashHint"></p>
      <div id="ch-list" class="ch-list"></div>
      <p class="muted small" data-t="chestFair"></p>
      <button class="btn ghost wide-btn" id="ch-close" data-t="close"></button>
    </div>
  </section>

  <section id="scr-lang" class="overlay" hidden>
    <div class="card result lang-pick">
      <h2>Язык · Language</h2>
      <div id="lang-list" class="chip-row"></div>
    </div>
  </section>

  <section id="scr-pchoice" class="overlay" hidden>
    <div class="card result pchoice">
      <h2 id="pc-mode"></h2>
      <button class="btn primary big wide-btn" id="pc-create" data-t="partyFriends"></button>
      <button class="btn wide-btn" id="pc-solo" data-t="partySolo"></button>
      <div class="row pc-join"><input id="pc-code" class="code-in" maxlength="5" placeholder="ABCDE" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="code"><button class="btn" id="pc-join" data-t="partyJoin"></button></div>
      <button class="btn ghost wide-btn" id="pc-close" data-t="close"></button>
    </div>
  </section>

  <section id="scr-party" class="overlay" hidden>
    <div class="card result party">
      <h2 data-t="partyTitle"></h2>
      <p class="muted"><span id="pt-mode"></span> · <span data-t="partyCode"></span> <b id="pt-code" class="pt-code"></b></p>
      <div id="pt-list" class="pt-list"></div>
      <button class="btn wide-btn" id="pt-share" data-t="partyShare"></button>
      <button class="btn primary big wide-btn" id="pt-start" data-t="partyStart"></button>
      <p id="pt-wait" class="muted center" data-t="partyWait"></p>
      <p class="muted small center" data-t="partyHint"></p>
      <button class="btn ghost wide-btn" id="pt-leave" data-t="partyLeave"></button>
    </div>
  </section>

  <section id="scr-settings" class="overlay" hidden>
    <div class="card result settings">
      <h2 data-t="settingsTitle"></h2>
      <h3 data-t="setFeel"></h3>
      <div class="set-group">
        <div class="set-row"><span data-t="setSound"></span><button id="set-sound" class="toggle" role="switch"></button></div>
        <div class="set-row"><span data-t="setMusic"></span><button id="set-music" class="toggle" role="switch"></button></div>
        <div class="set-row"><span data-t="setShake"></span><button id="set-shake" class="toggle" role="switch"></button></div>
        <div class="set-row" id="set-vib-row"><span data-t="setVibrate"></span><button id="set-vibrate" class="toggle" role="switch"></button></div>
        <div class="set-row"><span data-t="setFoeEmotes"></span><button id="set-emotes" class="toggle" role="switch"></button></div>
      </div>
      <h3 data-t="langTitle"></h3>
      <div id="p-langs" class="chip-row"></div>
      <h3 data-t="setHelp"></h3>
      <div class="set-group">
        <button class="set-link" id="set-report"><span data-t="setReport"></span><i>›</i></button>
        <button class="set-link" id="set-parents"><span data-t="setParents"></span><i>›</i></button>
        <a class="set-link" href="privacy.html"><span data-t="privacy"></span><i>›</i></a>
      </div>
      <button class="btn wide-btn" id="set-account" data-t="setAccount"></button>
      <p id="set-version" class="muted small center"></p>
      <button class="btn ghost wide-btn" id="set-close" data-t="close"></button>
    </div>
  </section>

  <section id="scr-report" class="overlay" hidden>
    <div class="card result report">
      <h2 data-t="repTitle"></h2>
      <div id="rep-kinds" class="chip-row"></div>
      <label id="rep-about-row" class="rep-field" hidden><span data-t="repAbout"></span><input id="rep-about" maxlength="40" autocomplete="off"></label>
      <label class="rep-field"><span data-t="repWhat"></span><textarea id="rep-text" maxlength="500" rows="5"></textarea></label>
      <p class="muted small" data-t="repSafe"></p>
      <button class="btn primary wide-btn" id="rep-send" data-t="repSend"></button>
      <button class="btn ghost wide-btn" id="rep-close" data-t="close"></button>
    </div>
  </section>

  <section id="scr-parents" class="overlay" hidden>
    <div class="card result parents">
      <h2 data-t="parentsTitle"></h2>
      <p class="parents-body" data-t="parentsBody"></p>
      <button class="btn ghost wide-btn" id="par-close" data-t="close"></button>
    </div>
  </section>

  <section id="scr-upgrade" class="overlay" hidden>
    <div class="card result upgrade">
      <h2 id="up-title" class="win"></h2>
      <p id="up-sub" class="muted"></p>
      <div id="up-list" class="up-list"></div>
    </div>
  </section>

  <section id="scr-modes" class="overlay" hidden>
    <div class="card result modes">
      <h2 data-t="modesTitle"></h2>
      <div id="md-list" class="md-list"></div>
      <button class="btn ghost wide-btn" id="md-close" data-t="close"></button>
    </div>
  </section>

  <section id="scr-slot" class="overlay" hidden>
    <div class="card result slot-card">
      <div id="sl-art" class="sl-art"></div>
      <h2 id="sl-title"></h2>
      <p id="sl-time" class="sl-time"></p>
      <p id="sl-info" class="muted small"></p>
      <button class="btn primary big wide-btn" id="sl-gems"></button>
      <p id="sl-paid" class="muted small" data-t="payNoChest" hidden></p>
      <div id="sl-ad"></div>
      <button class="btn ghost wide-btn" id="sl-close" data-t="close"></button>
    </div>
  </section>

  <section id="scr-open" class="opener" hidden>
    <div class="op-rays"></div>
    <div id="op-flash" class="op-flash"></div>
    <h2 id="op-title" class="op-title"></h2>
    <div class="op-stage">
      <div id="op-chest" class="op-chest"></div>
      <div id="op-glow" class="op-glow" hidden></div>
      <div id="op-item" class="op-item" hidden></div>
      <div id="op-sum" class="op-sum" hidden></div>
    </div>
    <p id="op-hint" class="op-hint"></p>
    <div id="op-btns" class="op-btns" hidden>
      <button class="btn primary big" id="op-again"></button>
      <button class="btn" id="op-done" data-t="chestDone"></button>
    </div>
  </section>

  <section id="scr-vs" class="vs-intro" hidden></section>

  <section id="scr-squad" class="overlay" hidden>
    <div class="card wide">
      <div class="row between">
        <h2 data-t="squadTitle"></h2>
        <div id="s-level" class="chip"></div>
      </div>
      <div class="versus">
        <div class="mine"><small data-t="squadTitle"></small><div id="s-slots" class="slots"></div></div>
        <span class="vs">VS</span>
        <div class="enemy">
          <small data-t="enemy"></small>
          <div id="s-enemy" class="mini-row"></div>
        </div>
      </div>
      <p id="s-note" class="squad-note"></p>
      <p class="muted" data-t="squadHint"></p>
      <p id="s-info" class="s-info"></p>
      <div id="s-cards" class="tiles"></div>
      <div class="row sticky">
        <button class="btn ghost" id="s-back" data-t="back"></button>
        <button class="btn primary grow" id="s-fight" data-t="fight"></button>
      </div>
    </div>
  </section>

  <section id="scr-result" class="overlay" hidden>
    <div class="card result">
      <div id="r-cmds" class="r-cmds" hidden></div>
      <div id="r-squad" class="trio"></div>
      <h2 id="r-title"></h2>
      <p id="r-sub" class="muted"></p>
      <div id="r-trophies" class="trophy-line" hidden></div>
      <p id="r-chest" class="chest-line" hidden></p>
      <p id="r-rank" class="chest-line rank-line" hidden></p>
      <p id="r-xp" class="chest-line xp-line"></p>
      <div class="coins-big"><i class="coin"></i><span id="r-coins"></span></div>
      <p id="r-reward" class="reply-note" hidden></p>
      <div id="r-ads" class="col"></div>
      <button class="btn share" id="r-share" data-t="challengeFriend" hidden></button>
      <div class="row">
        <button class="btn ghost" id="r-menu" data-t="menu"></button>
        <button class="btn primary grow" id="r-next"></button>
      </div>
    </div>
  </section>

  <section id="scr-watch" class="overlay" hidden>
    <div class="card wide">
      <h2 data-t="watchTitle"></h2>
      <p class="muted" data-t="watchHint"></p>
      <small class="you-label" data-t="left"></small>
      <div id="w-left" class="pick-row"></div>
      <small class="foe-label" data-t="right"></small>
      <div id="w-right" class="pick-row"></div>
      <div class="row">
        <button class="btn ghost" id="w-cancel" data-t="back"></button>
        <button class="btn primary grow" id="w-start" data-t="start"></button>
      </div>
    </div>
  </section>

  <section id="scr-challenge" class="overlay" hidden>
    <div class="card result">
      <p id="c-reply" class="reply-note" hidden></p>
      <h2 id="c-title"></h2>
      <div id="c-squad" class="mini-row big"></div>
      <p class="muted" data-t="mirrorNote"></p>
      <div class="row">
        <button class="btn ghost" id="c-skip" data-t="skip"></button>
        <button class="btn primary grow big" id="c-accept" data-t="accept"></button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
