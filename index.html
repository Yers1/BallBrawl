<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BallBrawl — битва шаров</title>
  <meta name="description" content="Шары с суперсилами дерутся в арене: Пиявка, Клетка, Паук, Ниндзя, Поезд, Магнит, Бомба и другие. Рывки, суперудары, путь кубков, скины и вызовы друзей. Бесплатно, прямо в браузере.">
  <meta name="theme-color" content="#0b1222">
  <meta property="og:title" content="BallBrawl — битва шаров">
  <meta property="og:description" content="Шары с суперсилами. Целься, делай рывки, жми супер — и вызывай друзей.">
  <meta property="og:type" content="website">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- AdSense H5 Games Ads. Replace the id (also in ads.txt); remove data-adbreak-test once approved.
       Kids' game: the age-treatment tag keeps every ad non-personalized (it replaces the deprecated
       child-directed / under-age-of-consent tags — adsbygoogle.js itself says so in the console). -->
  <script async data-ad-client="ca-pub-0000000000000000" data-adbreak-test="on"
    data-tag-for-age-treatment="1" data-ad-frequency-hint="90s"
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js" crossorigin="anonymous"></script>
</head>
<body>
  <header class="bar">
    <div class="brand">Ball<b>Brawl</b></div>
    <div class="row">
      <button id="mute" class="icon-btn" aria-label="sound"></button>
      <div class="pill" title="coins"><i class="coin"></i><span id="coins">0</span></div>
    </div>
  </header>

  <main class="stage">
    <div id="hud" class="hud" hidden>
      <div id="hud-you" class="dots"></div>
      <div id="hud-mid" class="hud-mid"></div>
      <div id="hud-foe" class="dots foe"></div>
    </div>
    <div class="arena-wrap">
      <canvas id="arena" aria-label="arena"></canvas>
      <div id="banner" class="banner"></div>
      <div id="hint" class="hint" hidden></div>
    </div>
    <div id="controls" class="controls" hidden>
      <div id="dash-pips" class="pips" aria-label="dash charges"></div>
      <button id="super-btn" class="super-btn" disabled><span data-t="super"></span></button>
    </div>
    <div id="watch-bar" class="watch-bar" hidden>
      <button class="btn" id="w-again" data-t="again"></button>
      <button class="btn ghost" id="w-back" data-t="back"></button>
    </div>
  </main>

  <footer class="foot"><a href="privacy.html" data-t="privacy"></a></footer>

  <!-- Home: a page with four tabs. The Road is the main screen. -->
  <section id="scr-home" class="page" hidden>
    <div class="page-in">
      <div class="me">
        <span id="h-avatar" class="avatar"></span>
        <div class="me-txt">
          <b id="h-nick"></b>
          <span class="trophies"><i class="trophy"></i><span id="h-trophies">0</span></span>
        </div>
      </div>
      <div id="tab-body" class="tab-body">
        <div id="tab-path" class="tab"><div id="road" class="road"></div></div>
        <div id="tab-balls" class="tab" hidden>
          <button class="btn wide-btn" id="b-watch" data-t="watch"></button>
          <h3 data-t="collection"></h3>
          <div id="b-grid" class="cards"></div>
        </div>
        <div id="tab-quests" class="tab" hidden>
          <h3 data-t="dailyTitle"></h3>
          <div id="q-daily" class="daily"></div>
          <p id="q-daily-note" class="muted center"></p>
          <h3 data-t="questsTitle"></h3>
          <div id="q-list" class="qlist"></div>
          <h3 data-t="achievementsTitle"></h3>
          <div id="q-ach" class="qlist"></div>
        </div>
        <div id="tab-leaders" class="tab" hidden>
          <div class="seg">
            <button id="l-all" class="on" data-t="allTime"></button>
            <button id="l-week" data-t="thisWeek"></button>
          </div>
          <p id="l-note" class="muted center"></p>
          <div id="l-list" class="llist"></div>
        </div>
        <div id="tab-profile" class="tab" hidden>
          <div class="nick-row big-nick">
            <span id="p-nick" class="nick"></span>
            <button id="p-renick" class="icon-btn sm" aria-label="new nickname">&#x1F3B2;</button>
          </div>
          <h3 data-t="avatarTitle"></h3>
          <div id="p-avatars" class="pick-row"></div>
          <h3 data-t="statsTitle"></h3>
          <div id="p-stats" class="stats"></div>
          <button class="btn wide-btn" id="p-challenge" data-t="challengeFriend"></button>
          <div id="p-online">
            <h3 data-t="codeTitle"></h3>
            <div class="code-box"><b id="p-code"></b><button id="p-copy" class="btn sm" data-t="copy"></button></div>
            <p class="muted" data-t="codeHint"></p>
            <div class="row">
              <input id="p-code-in" class="code-in" maxlength="8" placeholder="XXXXXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="code">
              <button id="p-redeem" class="btn sm primary" data-t="redeem"></button>
            </div>
            <button class="btn ghost danger wide-btn" id="p-delete" data-t="deleteProfile"></button>
          </div>
          <p id="p-offline" class="muted center" data-t="needNet" hidden></p>
          <p class="center"><a href="privacy.html" data-t="privacy"></a></p>
        </div>
      </div>
      <div class="home-bottom">
        <button id="h-play" class="btn primary big play" data-t="fightNow"></button>
        <nav class="tabs">
          <button data-tab="path"><svg viewBox="0 0 24 24"><path d="M12 2c-3 3-5 6-5 9a5 5 0 0 0 10 0c0-3-2-6-5-9Zm-1 18h2v2h-2zM7 18h10v1H7z"/></svg><span data-t="tabPath"></span><i class="badge" hidden></i></button>
          <button data-tab="balls"><svg viewBox="0 0 24 24"><circle cx="8" cy="14" r="5"/><circle cx="16.5" cy="8.5" r="4"/></svg><span data-t="tabBalls"></span><i class="badge" hidden></i></button>
          <button data-tab="quests"><svg viewBox="0 0 24 24"><path d="M5 3h14v18H5zM8 7h8v2H8zm0 4h8v2H8zm0 4h5v2H8z"/></svg><span data-t="tabQuests"></span><i class="badge" hidden></i></button>
          <button data-tab="leaders"><svg viewBox="0 0 24 24"><path d="M3 21V11h5v10zm6.5 0V4h5v17zM16 21v-7h5v7z"/></svg><span data-t="tabLeaders"></span><i class="badge" hidden></i></button>
          <button data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21a8.5 7 0 0 1 17 0z"/></svg><span data-t="tabProfile"></span><i class="badge" hidden></i></button>
        </nav>
      </div>
    </div>
  </section>

  <section id="scr-ball" class="overlay" hidden>
    <div class="card result">
      <div id="ball-icon" class="ball-hero"></div>
      <h2 id="ball-name"></h2>
      <p id="ball-hp" class="muted"></p>
      <p id="ball-about"></p>
      <p id="ball-super" class="sup-line"></p>
      <div id="ball-buy"></div>
      <h3 id="ball-skins-title" data-t="skinsTitle"></h3>
      <div id="ball-skins" class="skin-row"></div>
      <button class="btn ghost wide-btn" id="ball-close" data-t="close"></button>
    </div>
  </section>

  <section id="scr-reward" class="overlay" hidden>
    <div class="card result reward">
      <div id="rw-icon" class="ball-hero pop"></div>
      <h2 id="rw-text"></h2>
      <p id="rw-sub" class="muted"></p>
      <button class="btn primary big wide-btn" id="rw-ok" data-t="cool"></button>
    </div>
  </section>

  <section id="scr-squad" class="overlay" hidden>
    <div class="card wide">
      <div class="row between">
        <h2 data-t="squadTitle"></h2>
        <div id="s-level" class="chip"></div>
      </div>
      <div class="versus">
        <div id="s-slots" class="slots"></div>
        <span class="vs">VS</span>
        <div class="enemy">
          <small data-t="enemy"></small>
          <div id="s-enemy" class="mini-row"></div>
        </div>
      </div>
      <p id="s-note" class="squad-note"></p>
      <p class="muted" data-t="squadHint"></p>
      <div id="s-cards" class="cards"></div>
      <div class="row sticky">
        <button class="btn ghost" id="s-back" data-t="back"></button>
        <button class="btn primary grow" id="s-fight" data-t="fight"></button>
      </div>
    </div>
  </section>

  <section id="scr-result" class="overlay" hidden>
    <div class="card result">
      <h2 id="r-title"></h2>
      <p id="r-sub" class="muted"></p>
      <div id="r-trophies" class="trophy-line" hidden></div>
      <div class="coins-big"><i class="coin"></i><span id="r-coins"></span></div>
      <p id="r-reward" class="reply-note" hidden></p>
      <div id="r-ads" class="col"></div>
      <button class="btn share" id="r-share" data-t="challengeFriend" hidden></button>
      <div class="row">
        <button class="btn ghost" id="r-menu" data-t="tabPath"></button>
        <button class="btn primary grow" id="r-next"></button>
      </div>
    </div>
  </section>

  <section id="scr-watch" class="overlay" hidden>
    <div class="card wide">
      <h2 data-t="watchTitle"></h2>
      <p class="muted" data-t="watchHint"></p>
      <small class="you-label" data-t="left"></small>
      <div id="w-left" class="pick-row"></div>
      <small class="foe-label" data-t="right"></small>
      <div id="w-right" class="pick-row"></div>
      <div class="row">
        <button class="btn ghost" id="w-cancel" data-t="back"></button>
        <button class="btn primary grow" id="w-start" data-t="start"></button>
      </div>
    </div>
  </section>

  <section id="scr-challenge" class="overlay" hidden>
    <div class="card result">
      <p id="c-reply" class="reply-note" hidden></p>
      <h2 id="c-title"></h2>
      <div id="c-squad" class="mini-row big"></div>
      <p class="muted" data-t="mirrorNote"></p>
      <div class="row">
        <button class="btn ghost" id="c-skip" data-t="skip"></button>
        <button class="btn primary grow big" id="c-accept" data-t="accept"></button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
